<!DOCTYPE html>
<html>
<head>
    <title>Profile Details</title>
    <link rel="stylesheet" href="details.css">
</head>
<body>

<div class="details-page">

    <div class="profile-left">

        <img id="profileImage">

        <p>
            <strong>Name :</strong>
            <span id="profileName"></span>
        </p>

        <p>
            <strong>ID :</strong>
            <span id="profileId"></span>
        </p>

    </div>

    <div class="profile-right">

        <h2 id="title"></h2>

        <p><strong>Name :</strong> <span id="name"></span></p>
        <p><strong>DOB :</strong> 05-05-2000</p>
        <p><strong>Age :</strong> <span id="age"></span></p>
        <p><strong>Gender :</strong> <span id="gender"></span></p>
        <p><strong>Address :</strong> 1/3 Church Street Chennai</p>
        <p><strong>Religion :</strong> Christian</p>
        <p><strong>Caste :</strong> Nadar</p>
        <p><strong>Qualification :</strong> B.E(ECE)</p>
        <p><strong>Work :</strong> Office Chennai</p>
        <p><strong>Status :</strong> Single</p>
        <p><strong>Horoscope :</strong> Pisces</p>

        <button class="chat-btn">
            Chat With Profile
        </button>

    </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

document.getElementById("name").textContent =
params.get("name");

document.getElementById("profileName").textContent =
params.get("name");

document.getElementById("profileId").textContent =
params.get("id");

document.getElementById("age").textContent =
params.get("age");

document.getElementById("gender").textContent =
params.get("gender");

document.getElementById("profileImage").src =
params.get("img");

document.getElementById("title").textContent =
"Basic Details About " + params.get("name");

</script>

</body>
</html>
